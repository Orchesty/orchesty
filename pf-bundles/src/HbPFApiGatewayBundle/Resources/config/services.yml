services:
    _defaults:
        public: '%public.services%'

    hbpp.service.locator:
        class: Hanaboso\PipesFramework\ApiGateway\Locator\ServiceLocator
        arguments:
            - '@doctrine_mongodb.odm.default_document_manager'
            - '@hbpf.transport.curl_manager'
            - '@hbpf.redirect'
            - '%backendHost%'
            - '%tunnelProxyHost%'
            - '@cache.app'
            - '%actionCatalogTtl%'
        calls:
            - ['setLogger',['@monolog.logger.commons']]

    # Actions control plane: catalog + grant. Enterprise overrides the policy with group RBAC + audit.
    hbpf.action.grant_policy:
        class: Hanaboso\PipesFramework\ApiGateway\Action\AllowAllActionGrantPolicy

    hbpf.action.manager:
        class: Hanaboso\PipesFramework\ApiGateway\Action\ActionManager
        arguments:
            - '@hbpp.service.locator'
            - '@doctrine_mongodb.odm.default_document_manager'
            - '@hbpf.action.grant_policy'

    listener.controller.exception:
        class: Hanaboso\PipesFramework\ApiGateway\Listener\ControllerExceptionListener
        calls:
            - ['setLogger', ['@monolog.logger.commons']]
        tags:
            - { name: kernel.event_subscriber }

    Hanaboso\PipesFramework\ApiGateway\Authenticator\ApiKey\ApiKeyAuthenticator:
        class: Hanaboso\PipesFramework\ApiGateway\Authenticator\ApiKey\ApiKeyAuthenticator
        arguments:
            - '@Hanaboso\UserBundle\Model\Security\JWTAuthenticator'
            - '@hbpf.database_manager_locator'

    hbpp.application.webhook_config_manager:
        class: Hanaboso\PipesFramework\Application\Manager\WebhookConfigManager
        arguments:
            - '@doctrine_mongodb.odm.default_document_manager'
            - '@hbpp.service.locator'
